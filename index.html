<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Chi ha già la webapp in Home (start_url vecchia: "/") o un vecchio link
      // con route hash (/#/product/…) deve finire sull'app, non sulla landing.
      // iOS non aggiorna la start_url delle webapp già installate, quindi il
      // controllo va fatto qui, prima di caricare qualsiasi altra cosa.
      (function () {
        var standalone =
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true
        var oldRoute = location.hash.indexOf('#/') === 0
        if (standalone || oldRoute) location.replace('/app/' + location.hash)
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon-v5.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v5.png" />

    <meta name="theme-color" content="#f7f1e3" />
    <meta name="description" content="AllergyVerify scans a food product's barcode and tells you right away whether it contains your allergens. Free, no account, everything stays on your phone." />
